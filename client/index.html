<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yash Jha — Product Professional & AI/ML Engineer Portfolio</title>
    <meta name="description" content="Product Professional & AI/ML Engineer Portfolio featuring production LMS workflows at Istockly, industrial commerce journeys at Diptech Technologies, and CVPR AI research pipelines." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#171717" />
    <!--
      Static social defaults for crawlers that do not run JavaScript (LinkedIn, WhatsApp, Slack...).
      __SITE_URL__ is replaced at build time from VITE_SITE_URL (see client/vite.config.js).
      No canonical/og:url here: this file is served for every route, so a static canonical would
      point every page at the homepage. The SEO component adds per-page canonical URLs.
    -->
    <meta property="og:site_name" content="Yash Jha" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yash Jha — Product Professional & AI/ML Engineer Portfolio" />
    <meta property="og:description" content="Product Professional & AI/ML Engineer Portfolio featuring production LMS workflows at Istockly, industrial commerce journeys at Diptech Technologies, and CVPR AI research pipelines." />
    <meta property="og:image" content="__SITE_URL__/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Yash Jha — Product Professional & AI/ML Engineer portfolio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yash Jha — Product Professional & AI/ML Engineer Portfolio" />
    <meta name="twitter:description" content="Product Professional & AI/ML Engineer Portfolio featuring production LMS workflows at Istockly, industrial commerce journeys at Diptech Technologies, and CVPR AI research pipelines." />
    <meta name="twitter:image" content="__SITE_URL__/og-default.png" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="alternate" type="application/rss+xml" title="Yash Jha — Product Portfolio" href="__SITE_URL__/rss.xml" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="__SITE_URL__/sitemap.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
